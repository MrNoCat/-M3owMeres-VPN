name: "⚡MeowMeres VPN"

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"  # Каждые 6 часов

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  MAX_SERVERS: 60            # Сколько серверов реально тестируем (лимит нагрузки)
  TOP_N: 5                   # Сколько лучших серверов класть в итоговый список
  PING_ATTEMPTS: 3           # Сколько раз пинговать каждый сервер
  TEST_TIMEOUT: 3            # Таймаут одного теста в секундах
  PARALLEL_JOBS: 10          # Параллельных проверок
  MAX_SCORE: 999999          # Score для недоступных серверов
  CACHE_TTL: 3600            # Время жизни DNS-кэша, секунд

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        shell: bash
        run: |
          set -Eeuo pipefail

          # На раннере ubuntu-latest предустановлен репозиторий
          # packages.microsoft.com (azure-cli), который периодически отдаёт
          # битую подпись ("Clearsigned file isn't valid, got 'NOSPLIT'").
          # Имя файла источника может быть *.list или *.sources (deb822-формат
          # в Ubuntu 24.04), поэтому ищем по содержимому, а не по имени.
          for f in /etc/apt/sources.list.d/*; do
            if [ -f "$f" ] && grep -q "packages.microsoft.com" "$f" 2>/dev/null; then
              echo "Removing broken repo file: $f"
              sudo rm -f "$f"
            fi
          done

          sudo apt-get update
          sudo apt-get install -y \
            gawk \
            jq \
            netcat-openbsd \
            dnsutils \
            gzip \
            bc \
            parallel \
            moreutils
          # ВАЖНО: на ubuntu-latest системный /usr/bin/awk — это mawk,
          # который не понимает match($0, re, arr) с массивом.
          # Явно переключаемся на gawk, чтобы парсинг host/port не ломался молча.
          sudo update-alternatives --set awk /usr/bin/gawk

      - name: Cache DNS resolutions
        uses: actions/cache@v3
        id: dns-cache
        with:
          path: work/dns_cache.db
          key: dns-cache-${{ github.run_id }}
          restore-keys: |
            dns-cache-

      - name: Download VPN sources
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p work public tmp

          SOURCES=(
            "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/BLACK_VLESS_RUS.txt"
            "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/main/BLACK_VLESS_RUS_mobile.txt"
          )

          : > work/all.txt
          for url in "${SOURCES[@]}"; do
            echo "::group::Downloading: $url"
            tmpfile="$(mktemp)"
            if curl --silent --show-error --fail --location \
                 --retry 5 --retry-delay 2 \
                 --connect-timeout 10 --max-time 60 \
                 "$url" -o "$tmpfile"; then
              head -c 20M "$tmpfile" >> work/all.txt
              echo "" >> work/all.txt
              echo "✅ SUCCESS"
            else
              echo "::warning::Failed to download $url"
            fi
            rm -f "$tmpfile"
            echo "::endgroup::"
          done

          if [ ! -s work/all.txt ]; then
            echo "::error::No source data downloaded"
            exit 1
          fi

          echo "Total data size: $(wc -c < work/all.txt) bytes"

      - name: Build VPN list
        shell: bash
        run: |
          set -Eeuo pipefail
          export TZ=Europe/Moscow
          cd work

          # ============================================
          # 1. EXTRACTION & CLEANING
          # ============================================
          echo "::group::Extracting VLESS links"

          tr -d '\r' < all.txt | \
            awk 'length($0) < 10000' | \
            grep -aEo 'vless://[^[:space:]]+' > raw.txt || true

          if [ ! -s raw.txt ]; then
            echo "::error::No VLESS links found"
            cat > ../public/vpn.txt << 'EOF'
          # profile-title: 🐈 MeowMeres VPN
          # profile-update-interval: 720
          # subscription-auto-update-enable: 1
          # NO VLESS FOUND
          EOF
            exit 0
          fi

          echo "Raw links: $(wc -l < raw.txt)"
          echo "::endgroup::"

          # ============================================
          # 2. FILTERING
          # ============================================
          echo "::group::Filtering links"

          grep -aviE '(anycast|proxyip|cdn-cgi|workers\.dev|pages\.dev|cloudflare|cf-ipfs)' raw.txt | \
            sed -E \
              -e 's/\[(RUSSIA|BL|ANYCAST)\]//gi' \
              -e 's/%5B(BL|ANYCAST)%5D//gi' \
              -e 's/[[:space:]]+$//' \
            > clean.txt

          awk '!seen[$0]++' clean.txt > unique.txt

          grep -aE '^vless://' unique.txt | \
            grep -aviE '(expired|blocked|spam|localhost|127\.0\.0\.1)' \
            > filtered.txt || true

          if [ ! -s filtered.txt ]; then
            cp unique.txt filtered.txt
          fi

          # Перемешиваем и обрезаем до MAX_SERVERS, чтобы не тестировать
          # тысячи ссылок и не упираться в TEST_TIMEOUT / PARALLEL_JOBS.
          shuf filtered.txt | head -n "${MAX_SERVERS}" > filtered_capped.txt
          mv filtered_capped.txt filtered.txt

          echo "After filtering (capped at ${MAX_SERVERS}): $(wc -l < filtered.txt)"
          echo "::endgroup::"

          # ============================================
          # 3. DNS RESOLUTION WITH TTL-AWARE CACHE
          # ============================================
          echo "::group::DNS Resolution"

          awk '{
            if (match($0, /^vless:\/\/([^@]+@)?([^:\/?#]+)/, a)) {
              print a[2]
            }
          }' filtered.txt | sort -u > hosts.txt

          echo "Unique hosts: $(wc -l < hosts.txt)"

          if [ -f ../dns_cache.db ]; then
            cp ../dns_cache.db dns_cache.db || true
          else
            : > dns_cache.db
          fi
          touch dns_cache.lock

          resolve_host() {
            local host="$1"
            local cache_file="dns_cache.db"
            local lock_file="dns_cache.lock"
            local ttl="${CACHE_TTL}"
            local now
            now="$(date +%s)"

            # Формат кэша: host|ip|timestamp
            local cached_line
            cached_line=$(grep "^${host}|" "$cache_file" 2>/dev/null | tail -n1 || true)
            if [ -n "$cached_line" ]; then
              local cached_ip cached_ts age
              cached_ip=$(echo "$cached_line" | cut -d'|' -f2)
              cached_ts=$(echo "$cached_line" | cut -d'|' -f3)
              age=$((now - cached_ts))
              if [ -n "$cached_ip" ] && [ "$age" -lt "$ttl" ]; then
                echo "$cached_ip"
                return 0
              fi
            fi

            local ip=""
            if [[ "$host" =~ ^([0-9]{1,3}\.){3}[0-9]{1,3}$ ]]; then
              ip="$host"
            else
              ip="$(timeout 5 getent ahostsv4 "$host" | awk '{print $1}' | head -n1 || true)"
            fi

            if [ -n "$ip" ]; then
              # flock защищает от гонок при параллельной записи из разных процессов
              (
                flock -x 200
                echo "${host}|${ip}|${now}" >> "$cache_file"
              ) 200>"$lock_file"
              echo "$ip"
              return 0
            fi
            return 1
          }

          export -f resolve_host
          export CACHE_TTL

          cat hosts.txt | \
            parallel --jobs "${PARALLEL_JOBS}" --timeout 10 resolve_host {} > resolved_hosts_raw.txt 2>/dev/null || true

          # parallel не сохраняет исходный host в выводе resolve_host,
          # поэтому пересобираем пары host|ip через paste
          paste -d'|' hosts.txt resolved_hosts_raw.txt > resolved_ips.txt

          # Чистим кэш от устаревших записей (старше TTL), чтобы файл не рос бесконечно
          now="$(date +%s)"
          awk -F'|' -v now="$now" -v ttl="${CACHE_TTL}" '(now - $3) < ttl' dns_cache.db > dns_cache_clean.db || true
          mv dns_cache_clean.db dns_cache.db
          cp dns_cache.db ../dns_cache.db 2>/dev/null || true

          echo "Resolved IPs: $(grep -c '|[0-9]' resolved_ips.txt || echo 0)"
          echo "::endgroup::"

          # ============================================
          # 4. PERFORMANCE TESTING (multi-sample)
          # ============================================
          echo "::group::Testing server performance"

          awk -F'|' 'NR==FNR {ip[$1]=$2; next} {
            host=""; port="443"
            if (match($0, /^vless:\/\/([^@]+@)?([^:\/?#]+)/, a)) host=a[2]
            if (match($0, /.*:([0-9]{2,5})([/?#].*)?$/, p)) port=p[1]
            if (host && host in ip && ip[host] != "") print host"|"port"|"ip[host]"|"$0
          }' resolved_ips.txt filtered.txt > test_input.txt

          echo "Servers to test: $(wc -l < test_input.txt)"

          # Тест с несколькими замерами: берём медиану/минимум из PING_ATTEMPTS,
          # плюс учитываем потери пакетов — сервер с нестабильным пингом штрафуется.
          test_server() {
            local line="$1"
            local host port target link
            local timeout_s="${TEST_TIMEOUT}"
            local attempts="${PING_ATTEMPTS}"

            IFS='|' read -r host port target link <<< "$line"

            local samples=()
            local sent=0 recv=0

            for _ in $(seq 1 "$attempts"); do
              sent=$((sent + 1))
              local ms
              ms=$(ping -c 1 -W "$timeout_s" "$target" 2>/dev/null | grep -oP 'time=\K[0-9.]+' | head -n1 || true)
              if [ -n "$ms" ]; then
                recv=$((recv + 1))
                samples+=("$ms")
              fi
            done

            local final_score
            if [ "${#samples[@]}" -gt 0 ]; then
              # среднее по успешным замерам (в bc, чтобы не терять дробную часть)
              local sum=0
              for s in "${samples[@]}"; do
                sum=$(echo "$sum + $s" | bc)
              done
              local avg
              avg=$(echo "scale=2; $sum / ${#samples[@]}" | bc)

              # штраф за потерю пакетов: чем больше потерь, тем хуже итоговый score
              local loss_penalty
              loss_penalty=$(echo "scale=2; ($sent - $recv) * 40" | bc)

              final_score=$(echo "$avg + $loss_penalty" | bc)
            else
              # ICMP недоступен — fallback на TCP connect с точным замером в мс
              local start end
              start=$(date +%s%3N)
              if timeout "$timeout_s" nc -zv "$target" "$port" 2>/dev/null; then
                end=$(date +%s%3N)
                final_score=$((end - start))
              else
                echo "${MAX_SCORE}|${link}"
                return 0
              fi
            fi

            # Бонусы теперь мультипликативные (0 < multiplier <= 1), а не вычитание —
            # так score никогда не уходит в отрицательные значения и не "прилипает" к 1,
            # сохраняя относительный порядок между быстрыми серверами.
            local multiplier=1.0
            echo "$link" | grep -qi 'reality' && multiplier=$(echo "$multiplier * 0.85" | bc)
            echo "$link" | grep -qi 'grpc'    && multiplier=$(echo "$multiplier * 0.90" | bc)
            echo "$link" | grep -qi 'tls'     && multiplier=$(echo "$multiplier * 0.93" | bc)
            echo "$link" | grep -qi 'ws'      && multiplier=$(echo "$multiplier * 0.97" | bc)
            [ "$port" = "443" ] && multiplier=$(echo "$multiplier * 0.95" | bc)

            final_score=$(echo "scale=2; $final_score * $multiplier" | bc)

            # защита от пустого/некорректного результата bc
            final_score=$(printf '%.0f' "$final_score" 2>/dev/null || echo "${MAX_SCORE}")
            [ "$final_score" -lt 1 ] && final_score=1

            echo "${final_score}|${link}"
          }

          export -f test_server
          export TEST_TIMEOUT PING_ATTEMPTS MAX_SCORE

          cat test_input.txt | \
            parallel --jobs "${PARALLEL_JOBS}" --timeout "$((TEST_TIMEOUT * PING_ATTEMPTS + 5))" \
              test_server {} > scored.txt 2>/dev/null || true

          if [ ! -s scored.txt ]; then
            echo "::warning::All tests failed, using unfiltered list"
            awk '{print "999999|"$0}' filtered.txt > scored.txt
          fi

          echo "Tested servers: $(wc -l < scored.txt)"
          echo "::endgroup::"

          # ============================================
          # 5. SELECT BEST SERVERS (top-N overall + per protocol)
          # ============================================
          echo "::group::Selecting best servers"

          # Отбрасываем недоступные (MAX_SCORE) перед сортировкой
          awk -F'|' -v maxscore="${MAX_SCORE}" '$1 < maxscore' scored.txt \
            | sort -t'|' -n -k1 > sorted.txt

          if [ ! -s sorted.txt ]; then
            echo "::warning::No reachable servers, falling back to full sorted list"
            sort -t'|' -n -k1 scored.txt > sorted.txt
          fi

          echo "Top 10 fastest (score|link):"
          head -n 10 sorted.txt | nl

          # Топ-N лучших вообще, независимо от протокола — это и есть
          # реальное "улучшение подбора быстрых серверов"
          cut -d'|' -f2- sorted.txt | head -n "${TOP_N}" > top_n.txt

          select_by_protocol() {
            local protocol="$1"
            cut -d'|' -f2- sorted.txt | grep -iE "(^|.*[^a-z])${protocol}([^a-z]|$)" | head -n 1 || true
          }

          REALITY=$(select_by_protocol "reality")
          GRPC=$(select_by_protocol "grpc")
          XHTTP=$(select_by_protocol "xhttp")

          echo "::endgroup::"

          # ============================================
          # 6. GENERATE OUTPUT
          # ============================================
          echo "::group::Generating output"

          DATE="$(date +"%d.%m.%Y")"
          TIME="$(date +"%H:%M")"

          add_remark() {
            local link="$1"
            local name="$2"
            [ -z "$link" ] && return 1
            link="${link%%#*}"
            encoded_name="$(printf '%s' "$name" | jq -sRr @uri)"
            echo "${link}#${encoded_name}"
          }

          {
            echo "# profile-title: 🐈 MeowMeres VPN"
            echo "# profile-update-interval: 720"
            echo "# subscription-auto-update-enable: 1"
            echo "# subscription-userinfo: upload=0; download=0; total=0; expire=0"
            echo "# update: $DATE $TIME (MSK)"
            echo "# stats: total=$(wc -l < filtered.txt), tested=$(wc -l < scored.txt), reachable=$(wc -l < sorted.txt)"
            echo ""

            # Топ-N лучших серверов по факту измеренной скорости
            i=1
            while IFS= read -r link; do
              add_remark "$link" "🐈 MeowMeres VPN #${i}"
              i=$((i + 1))
            done < top_n.txt

            # Плюс явные варианты по протоколу для совместимости с разными клиентами
            [ -n "$REALITY" ] && add_remark "$REALITY" "🐈 MeowMeres VPN REALITY"
            [ -n "$GRPC" ]    && add_remark "$GRPC"    "🐈 MeowMeres VPN gRPC"
            [ -n "$XHTTP" ]   && add_remark "$XHTTP"   "🐈 MeowMeres VPN XHTTP"
          } > ../public/vpn.txt

          cp ../public/vpn.txt ../public/android.txt 2>/dev/null || true

          gzip -fk ../public/vpn.txt || true
          gzip -fk ../public/android.txt || true

          echo "✅ Generated vpn.txt ($(wc -l < ../public/vpn.txt) lines)"
          echo "::endgroup::"

      - name: Verify output
        shell: bash
        run: |
          set -Eeuo pipefail

          if [ ! -s public/vpn.txt ]; then
            echo "::error::Output file is empty"
            exit 1
          fi

          if ! grep -q '^vless://' public/vpn.txt; then
            echo "::warning::No VLESS links in output"
          else
            echo "✅ Output contains $(grep -c '^vless://' public/vpn.txt) VLESS links"
          fi

          size=$(stat -c%s public/vpn.txt 2>/dev/null || stat -f%z public/vpn.txt 2>/dev/null)
          if [ "$size" -lt 100 ]; then
            echo "::warning::Output file is suspiciously small ($size bytes)"
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
