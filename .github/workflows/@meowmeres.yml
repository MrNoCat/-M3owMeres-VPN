name: VPN Auto Detect Build (STABLE FIX)

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download source
        run: |
          curl -fLsS -o original.txt https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/main/BLACK_VLESS_RUS.txt
      - name: Build VPN list
        run: |
          set -euo pipefail
          export TZ=Europe/Moscow
          mkdir -p public
          tr -d '\r' < original.txt > fixed.txt
          grep -a -v '^$' fixed.txt > clean.txt || true
          [ -s clean.txt ] || { echo "EMPTY INPUT" > public/vpn.txt; exit 0; }
          sed -E 's/[[:space:]]*\[(BL|RU)\][[:space:]]*//g' clean.txt > no_tags.txt
          grep -E '^vless://|^trojan://|^ss://' no_tags.txt > vpn_raw.txt || true
          [ -s vpn_raw.txt ] || { echo "NO VALID SERVERS" > public/vpn.txt; exit 0; }
          sed 's/\r//g' vpn_raw.txt > vpn_clean.txt
          grep -E '://.+@.+:[0-9]+' vpn_clean.txt > validated.txt || true
          [ -s validated.txt ] || { echo "EMPTY AFTER VALIDATION" > public/vpn.txt; exit 0; }
          # =========================
          # REMOVE RU + ANYCAST SERVERS (ONLY TAGS)
          # =========================
          grep -viE '#.*(russia|moscow|spb|novosibirsk|ru|anycast)' validated.txt > filtered.txt || true
          # fallback
          if [ ! -s filtered.txt ]; then
            cp validated.txt filtered.txt
          fi
          head -n 300 filtered.txt > limited.txt
          shuf limited.txt > final.txt
          DATE=$(date +"%d.%m.%Y")
          TIME=$(date +"%H:%M")
          COUNT=$(wc -l < final.txt)
          {
            echo "# profile-title: 🔥MeowMeres VPN"
            echo "# Date/Time: $DATE $TIME (MSK)"
            echo "# Servers: $COUNT"
            echo ""
            cat final.txt
          } > public/vpn.txt
          cp final.txt public/android.txt
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages

    steps:
      - name: Deploy
        uses: actions/deploy-pages@v4
