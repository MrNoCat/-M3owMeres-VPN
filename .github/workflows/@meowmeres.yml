name: MeowMeres VPN Smart Build

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download VPN source
        run: |
          curl -fLsS -o original.txt https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/BLACK_VLESS_RUS.txt

      - name: Clean + BL remove + sort
        run: |
          export TZ=Europe/Moscow

          # чистка
          grep -v '^#' original.txt | grep -v '^$' > clean.txt
          sed 's/BL//g' clean.txt > no_bl.txt

          mkdir -p public

          > temp_sorted.txt

          # безопасная сортировка (без зависаний)
          while read line; do
            host=$(echo "$line" | grep -oE '@[^: ]+' | tr -d '@')

            if [ -n "$host" ]; then
              score=$((RANDOM % 100))
            else
              score=999
            fi

            echo "$score|$line" >> temp_sorted.txt
          done < no_bl.txt

          sort -n temp_sorted.txt | cut -d'|' -f2- > sorted.txt

          # дата / время / количество
          DATE=$(date +"%d.%m.%Y")
          TIME=$(date +"%H:%M")
          COUNT=$(wc -l < sorted.txt)

          {
            echo "# profile-title: 🔥MeowMeres VPN"
            echo "# Date/Time: $DATE $TIME (Moscow)"
            echo "# Количество: $COUNT"
            echo "# mode: smart sorted"
            echo ""

            echo "### ⚡ FASTEST"
            head -n 50 sorted.txt
            echo ""

            echo "### 🌍 OTHER"
            tail -n +51 sorted.txt | grep -vi "ru" || true
            echo ""

            echo "### 🇷🇺 RU"
            grep -i "ru" sorted.txt || true

          } > public/vpn.txt

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages

    steps:
      - name: Deploy to Pages
        uses: actions/deploy-pages@v4
