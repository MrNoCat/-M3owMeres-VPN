name: "⚡MeowMeres VPN"

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"  # Каждые 6 часов вместо 30 минут

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  MAX_SERVERS: 10           # Максимум серверов для тестирования
  TEST_TIMEOUT: 3           # Таймаут теста в секундах
  PARALLEL_JOBS: 10         # Параллельных проверок
  MAX_SCORE: 999999         # Максимальный score для недоступных
  CACHE_TTL: 3600           # Время жизни кэша DNS

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            jq \
            netcat-openbsd \
            dnsutils \
            gzip \
            bc \
            parallel \
            moreutils

      - name: Cache DNS resolutions
        uses: actions/cache@v3
        id: dns-cache
        with:
          path: work/dns_cache.db
          key: dns-cache-${{ github.run_id }}
          restore-keys: |
            dns-cache-

      - name: Download VPN sources
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p work public tmp
          
          SOURCES=(
            "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/BLACK_VLESS_RUS.txt"
            "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/main/BLACK_VLESS_RUS_mobile.txt"
          )
          
          : > work/all.txt
          for url in "${SOURCES[@]}"; do
            echo "::group::Downloading: $url"
            tmpfile="$(mktemp)"
            if curl --silent --show-error --fail --location \
                 --retry 5 --retry-delay 2 \
                 --connect-timeout 10 --max-time 60 \
                 "$url" -o "$tmpfile"; then
              head -c 20M "$tmpfile" >> work/all.txt
              echo "" >> work/all.txt
              echo "✅ SUCCESS"
            else
              echo "::warning::Failed to download $url"
            fi
            rm -f "$tmpfile"
            echo "::endgroup::"
          done
          
          if [ ! -s work/all.txt ]; then
            echo "::error::No source data downloaded"
            exit 1
          fi
          
          echo "Total data size: $(wc -c < work/all.txt) bytes"

      - name: Build VPN list
        shell: bash
        run: |
          set -Eeuo pipefail
          export TZ=Europe/Moscow
          cd work

          # ============================================
          # 1. EXTRACTION & CLEANING
          # ============================================
          echo "::group::Extracting VLESS links"
          
          tr -d '\r' < all.txt | \
            awk 'length($0) < 10000' | \
            grep -aEo 'vless://[^[:space:]]+' > raw.txt || true
          
          if [ ! -s raw.txt ]; then
            echo "::error::No VLESS links found"
            cat > ../public/vpn.txt << 'EOF'
          # profile-title: 🐈 MeowMeres VPN
          # profile-update-interval: 720
          # subscription-auto-update-enable: 1
          # NO VLESS FOUND
          EOF
            exit 0
          fi
          
          echo "Raw links: $(wc -l < raw.txt)"
          echo "::endgroup::"

          # ============================================
          # 2. FILTERING
          # ============================================
          echo "::group::Filtering links"
          
          grep -aviE '(anycast|proxyip|cdn-cgi|workers\.dev|pages\.dev|cloudflare|cf-ipfs)' raw.txt | \
            sed -E \
              -e 's/\[(RUSSIA|BL|ANYCAST)\]//gi' \
              -e 's/%5B(BL|ANYCAST)%5D//gi' \
              -e 's/[[:space:]]+$//' \
            > clean.txt
          
          awk '!seen[$0]++' clean.txt > unique.txt
          
          grep -aE '^vless://' unique.txt | \
            grep -aviE '(expired|blocked|spam|localhost|127\.0\.0\.1)' \
            > filtered.txt || true
          
          if [ ! -s filtered.txt ]; then
            cp unique.txt filtered.txt
          fi
          
          echo "After filtering: $(wc -l < filtered.txt)"
          echo "::endgroup::"

          # ============================================
          # 3. DNS RESOLUTION WITH CACHE
          # ============================================
          echo "::group::DNS Resolution"
          
          # Extract hosts
          awk '{
            if (match($0, /^vless:\/\/([^@]+@)?([^:\/?#]+)/, a)) {
              print a[2]
            }
          }' filtered.txt | sort -u > hosts.txt
          
          echo "Unique hosts: $(wc -l < hosts.txt)"
          
          # Initialize DNS cache from previous runs
          if [ -f ../dns_cache.db ]; then
            cp ../dns_cache.db dns_cache.db || true
          fi
          
          # Resolve with caching
          resolve_host() {
            local host="$1"
            local cache_file="dns_cache.db"
            
            # Check cache
            if [ -f "$cache_file" ]; then
              local cached=$(grep "^$host|" "$cache_file" | cut -d'|' -f2 | head -n1)
              if [ -n "$cached" ]; then
                echo "$cached"
                return 0
              fi
            fi
            
            # Resolve
            local ip=""
            if [[ "$host" =~ ^([0-9]{1,3}\.){3}[0-9]{1,3}$ ]]; then
              ip="$host"
            else
              ip="$(timeout 5 getent ahostsv4 "$host" | awk '{print $1}' | head -n1 || true)"
            fi
            
            if [ -n "$ip" ]; then
              echo "$host|$ip" >> "$cache_file"
              echo "$ip"
              return 0
            fi
            return 1
          }
          
          export -f resolve_host
          
          # Parallel DNS resolution
          cat hosts.txt | \
            parallel --jobs 10 --timeout 10 resolve_host {} > resolved_ips.txt 2>/dev/null || true
          
          # Save cache for next run
          cp dns_cache.db ../dns_cache.db 2>/dev/null || true
          
          echo "Resolved IPs: $(wc -l < resolved_ips.txt)"
          echo "::endgroup::"

          # ============================================
          # 4. PERFORMANCE TESTING
          # ============================================
          echo "::group::Testing server performance"
          
          # Parse host:port mapping
          awk -F'|' 'NR==FNR {ip[$1]=$2; next} {
            host=""; port="443"
            if (match($0, /^vless:\/\/([^@]+@)?([^:\/?#]+)/, a)) host=a[2]
            if (match($0, /.*:([0-9]{2,5})([/?#].*)?$/, p)) port=p[1]
            if (host && host in ip) print host"|"port"|"ip[host]"|"$0
          }' resolved_ips.txt filtered.txt > test_input.txt
          
          echo "Servers to test: $(wc -l < test_input.txt)"
          
          # Test function with ping + TCP
          test_server() {
            local line="$1"
            local host port target link
            local ping_ms tcp_ms final_score
            
            IFS='|' read -r host port target link <<< "$line"
            
            # Try ICMP ping first (fastest)
            ping_ms=$(ping -c 1 -W 2 "$target" 2>/dev/null | \
              grep -oP 'time=\K[0-9.]+' | head -n1)
            
            if [ -n "$ping_ms" ]; then
              # Convert to integer
              final_score=$(printf '%.0f' "$ping_ms" 2>/dev/null || echo 999999)
            else
              # Fallback to TCP connect
              local start=$(date +%s%3N 2>/dev/null || echo 0)
              if timeout 3 nc -zv "$target" "$port" 2>/dev/null; then
                local end=$(date +%s%3N 2>/dev/null || echo 0)
                tcp_ms=$((end - start))
                final_score=$((tcp_ms > 0 ? tcp_ms : 999999))
              else
                final_score=999999
              fi
            fi
            
            # Apply protocol bonuses
            if echo "$link" | grep -qi 'reality'; then
              final_score=$((final_score - 50))
            fi
            if echo "$link" | grep -qi 'grpc'; then
              final_score=$((final_score - 30))
            fi
            if echo "$link" | grep -qi 'tls'; then
              final_score=$((final_score - 20))
            fi
            if echo "$link" | grep -qi 'ws'; then
              final_score=$((final_score - 10))
            fi
            if [ "$port" = "443" ]; then
              final_score=$((final_score - 15))
            fi
            
            [ "$final_score" -lt 1 ] && final_score=1
            
            echo "${final_score}|${link}"
          }
          
          export -f test_server
          
          # Parallel testing with rate limiting
          cat test_input.txt | \
            parallel --jobs 10 --timeout 5 --halt soon,fail=1 \
              test_server {} > scored.txt 2>/dev/null || true
          
          if [ ! -s scored.txt ]; then
            echo "::warning::All tests failed, using unfiltered list"
            cp filtered.txt scored.txt
          fi
          
          echo "Tested servers: $(wc -l < scored.txt)"
          echo "::endgroup::"

          # ============================================
          # 5. SELECT BEST SERVERS
          # ============================================
          echo "::group::Selecting best servers"
          
          sort -t'|' -n -k1 scored.txt | cut -d'|' -f2- > sorted.txt
          
          # Show top 10
          echo "Top 10 fastest:"
          head -n 10 sorted.txt | nl
          
          # Select by protocol with intelligent fallback
          select_by_protocol() {
            local protocol="$1"
            local result=""
            
            # Try exact match first
            result=$(grep -iE "(^|.*[^a-z])${protocol}([^a-z]|$)" sorted.txt | head -n 1 || echo "")
            
            # Fallback to partial match
            if [ -z "$result" ]; then
              result=$(grep -iE "$protocol" sorted.txt | head -n 1 || echo "")
            fi
            
            # Final fallback to fastest
            if [ -z "$result" ]; then
              result=$(head -n 1 sorted.txt || echo "")
            fi
            
            echo "$result"
          }
          
          TCP=$(select_by_protocol "tcp")
          REALITY=$(select_by_protocol "reality")
          GRPC=$(select_by_protocol "grpc")
          XHTTP=$(select_by_protocol "xhttp")
          
          # Use the best available
          TCP="${TCP:-$REALITY}"
          XHTTP="${XHTTP:-$REALITY}"
          GRPC="${GRPC:-$REALITY}"
          
          echo "Selected servers:"
          echo "  TCP: $TCP"
          echo "  XHTTP: $XHTTP"
          echo "  GRPC: $GRPC"
          echo "::endgroup::"

          # ============================================
          # 6. GENERATE OUTPUT
          # ============================================
          echo "::group::Generating output"
          
          DATE="$(date +"%d.%m.%Y")"
          TIME="$(date +"%H:%M")"
          
          # URL encode with proper handling
          add_remark() {
            local link="$1"
            local name="$2"
            [ -z "$link" ] && return 1
            link="${link%%#*}"
            # Use printf instead of echo -n
            encoded_name="$(printf '%s' "$name" | jq -sRr @uri)"
            echo "${link}#${encoded_name}"
          }
          
          # Create named links
          TCP_NAMED=$(add_remark "$TCP" "🐈 MeowMeres VPN TCP" || echo "")
          XHTTP_NAMED=$(add_remark "$XHTTP" "🐈 MeowMeres VPN XHTTP" || echo "")
          GRPC_NAMED=$(add_remark "$GRPC" "🐈 MeowMeres VPN gRPC" || echo "")
          
          # Generate subscription file
          {
            echo "# profile-title: 🐈 MeowMeres VPN"
            echo "# profile-update-interval: 720"
            echo "# subscription-auto-update-enable: 1"
            echo "# subscription-userinfo: upload=0; download=0; total=0; expire=0"
            echo "# update: $DATE $TIME (MSK)"
            echo "# servers: 3"
            echo "# stats: total=$(wc -l < filtered.txt), tested=$(wc -l < scored.txt)"
            echo ""
            [ -n "$TCP_NAMED" ] && echo "$TCP_NAMED"
            [ -n "$XHTTP_NAMED" ] && echo "$XHTTP_NAMED"
            [ -n "$GRPC_NAMED" ] && echo "$GRPC_NAMED"
          } > ../public/vpn.txt
          
          # Also generate for Android
          cp ../public/vpn.txt ../public/android.txt 2>/dev/null || true
          
          # Compress
          gzip -fk ../public/vpn.txt || true
          gzip -fk ../public/android.txt || true
          
          echo "✅ Generated vpn.txt ($(wc -l < ../public/vpn.txt) lines)"
          echo "::endgroup::"

      - name: Verify output
        shell: bash
        run: |
          set -Eeuo pipefail
          
          if [ ! -s public/vpn.txt ]; then
            echo "::error::Output file is empty"
            exit 1
          fi
          
          # Check if contains valid links
          if ! grep -q '^vless://' public/vpn.txt; then
            echo "::warning::No VLESS links in output"
          else
            echo "✅ Output contains $(grep -c '^vless://' public/vpn.txt) VLESS links"
          fi
          
          # Check file size
          size=$(stat -c%s public/vpn.txt 2>/dev/null || stat -f%z public/vpn.txt 2>/dev/null)
          if [ "$size" -lt 100 ]; then
            echo "::warning::Output file is suspiciously small ($size bytes)"
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
