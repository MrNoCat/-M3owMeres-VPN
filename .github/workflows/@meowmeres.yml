name: "⚡MeowMeres VPN Premium Build"

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download sources
        run: |
          set +e
          curl -fLsS -o a.txt https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/main/BLACK_SS%2BAll_RUS.txt
          curl -fLsS -o b.txt https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/main/BLACK_VLESS_RUS_mobile.txt
          touch a.txt b.txt
          cat a.txt b.txt > all.txt

      - name: Build premium list
        run: |
          set -eo pipefail
          export TZ=Europe/Moscow
          mkdir -p public

          # =========================
          # INPUT CHECK
          # =========================
          if [ ! -s all.txt ]; then
            echo "NO INPUT DATA" > public/vpn.txt
            exit 0
          fi

          tr -d '\r' < all.txt > fixed.txt

          # =========================
          # EXTRACT LINKS
          # =========================
          grep -aEo '(vless|trojan|ss)://[^[:space:]]+' fixed.txt > raw.txt || true

          if [ ! -s raw.txt ]; then
            echo "NO LINKS FOUND" > public/vpn.txt
            exit 0
          fi

          # =========================
          # CLEAN + DEDUP
          # =========================
          sed -E 's/\[(RU|BL|ANYCAST)\]//g' raw.txt > clean.txt
          awk '!seen[$0]++' clean.txt > unique.txt

          # =========================
          # VALIDATE
          # =========================
          grep -aE '://.+@.+:[0-9]+' unique.txt > valid.txt || true
          if [ ! -s valid.txt ]; then
            cp unique.txt valid.txt
          fi

          # =========================
          # FILTER BAD TAGS ONLY
          # =========================
          grep -aviE '#.*(russia|anycast)' valid.txt > filtered.txt || true
          if [ ! -s filtered.txt ]; then
            cp valid.txt filtered.txt
          fi

          # =========================
          # PREMIUM HEALTH SCAN (FAST TCP CHECK)
          # =========================
          > scored.txt

          while read -r line; do
            ip=$(echo "$line" | grep -oE '([0-9]{1,3}\.){3}[0-9]{1,3}' | head -n 1)

            if [ -z "$ip" ]; then
              echo "9999 $line" >> scored.txt
              continue
            fi

            start=$(date +%s%N)

            timeout 1 bash -c "</dev/tcp/$ip/443" 2>/dev/null
            ok=$?

            end=$(date +%s%N)

            if [ $ok -eq 0 ]; then
              ms=$(( (end - start) / 1000000 ))
            else
              ms=9999
            fi

            echo "$ms $line" >> scored.txt

          done < filtered.txt

          # =========================
          # SORT BY SPEED (LIKE PREMIUM VPN)
          # =========================
          sort -n scored.txt | cut -d' ' -f2- > sorted.txt

          # =========================
          # FINAL LIST
          # =========================
          head -n 200 sorted.txt > final.txt
          shuf final.txt > out.txt

          DATE=$(date +"%d.%m.%Y")
          TIME=$(date +"%H:%M")
          COUNT=$(wc -l < out.txt)

          {
            echo "# profile-title: ⚡MeowMeres VPN Premium"
            echo "# update: $DATE $TIME (MSK)"
            echo "# servers: $COUNT"
            echo "# mode: premium-sorted"
            echo ""

            cat out.txt
          } > public/vpn.txt

          cp out.txt public/android.txt

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages

    steps:
      - name: Deploy
        uses: actions/deploy-pages@v4
