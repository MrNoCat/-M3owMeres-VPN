name: "⚡MeowMeres VPN"

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */12 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            jq \
            netcat-openbsd \
            dnsutils \
            openssl \
            gzip

      - name: Download VPN sources
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p work public tmp
          SOURCES=(
            "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/BLACK_VLESS_RUS.txt"
            "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/main/BLACK_VLESS_RUS_mobile.txt"
          )
          : > work/all.txt
          for url in "${SOURCES[@]}"; do
            echo "Downloading: $url"
            tmpfile="$(mktemp)"
            if curl --silent --show-error --fail --location --retry 5 --retry-delay 2 --connect-timeout 10 --max-time 60 "$url" -o "$tmpfile"; then
              head -c 20M "$tmpfile" >> work/all.txt
              echo "" >> work/all.txt
              echo "SUCCESS"
            else
              echo "::warning::Failed to download $url"
            fi
            rm -f "$tmpfile"
          done
          if [ ! -s work/all.txt ]; then
            echo "::error::No source data downloaded"
            exit 1
          fi

      - name: Build VPN list (3 fastest servers)
        shell: bash
        run: |
          set -Eeuo pipefail
          export TZ=Europe/Moscow
          cd work

          MAX_SCORE=999999

          # Нормализация
          tr -d '\r' < all.txt > fixed.txt
          awk 'length($0) < 10000' fixed.txt > safe.txt

          # Извлекаем только vless
          grep -aEo 'vless://[^[:space:]]+' safe.txt > raw.txt || true
          if [ ! -s raw.txt ]; then
            echo "NO VLESS FOUND" > ../public/vpn.txt
            exit 0
          fi

          # Удаляем мусорные теги
          grep -aviE '(anycast|proxyip|cdn-cgi|workers\.dev|pages\.dev|cloudflare|cf-ipfs)' raw.txt | \
            sed -E -e 's/\[(RUSSIA|BL|ANYCAST)\]//gi' -e 's/%5BBL%5D//gi' -e 's/%5BANYCAST%5D//gi' -e 's/[[:space:]]+$//' > clean.txt

          # Убираем дубли
          awk '!seen[$0]++' clean.txt > unique.txt

          # Оставляем только корректные vless
          grep -aE '^vless://' unique.txt > valid.txt || true
          grep -aviE '(expired|blocked|spam|localhost|127\.0\.0\.1)' valid.txt > filtered.txt || true
          if [ ! -s filtered.txt ]; then
            cp valid.txt filtered.txt
          fi

          # Извлекаем уникальные хосты для DNS
          awk '{
            if (match($0, /^vless:\/\/([^@]+@)?([^:\/?#]+)/, a)) {
              print a[2]
            }
          }' filtered.txt | sort -u > hosts.txt

          # DNS кэш
          : > dns_cache.txt
          while IFS= read -r host; do
            if [[ "$host" =~ ^([0-9]{1,3}\.){3}[0-9]{1,3}$ ]]; then
              echo "$host|$host" >> dns_cache.txt
              continue
            fi
            ip="$(timeout 5 getent ahostsv4 "$host" | awk '{print $1}' | head -n1 || true)"
            if [ -n "${ip:-}" ]; then
              echo "$host|$ip" >> dns_cache.txt
            fi
          done < hosts.txt

          # Функция скоринга
          score_server() {
            local line="$1"
            local host port target start end latency score port_extract
            host=""
            port="443"
            host="$(printf '%s\n' "$line" | sed -nE 's#^vless://([^@]+@)?([^:/?#]+).*#\2#p' | head -n1)"
            port_extract="$(printf '%s\n' "$line" | sed -nE 's#.*:([0-9]{2,5})([/?#].*)?$#\1#p' | head -n1)"
            if [ -n "${port_extract:-}" ]; then
              port="$port_extract"
            fi
            if [ -z "${host:-}" ]; then
              echo "${MAX_SCORE}|$line"
              return
            fi
            target="$(awk -F'|' -v h="$host" '$1==h {print $2}' dns_cache.txt | head -n1 || true)"
            if [ -z "${target:-}" ]; then
              echo "${MAX_SCORE}|$line"
              return
            fi
            start="$(date +%s%3N)"
            if timeout 5 openssl s_client -connect "$target:$port" -servername "$host" </dev/null >/dev/null 2>&1; then
              end="$(date +%s%3N)"
              latency=$((end - start))
              if [ "$latency" -le 0 ]; then
                latency=1
              fi
            else
              latency="$MAX_SCORE"
            fi
            score="$latency"
            if printf '%s\n' "$line" | grep -qi 'reality'; then
              score=$((score - 30))
            fi
            if printf '%s\n' "$line" | grep -qi 'grpc'; then
              score=$((score - 15))
            fi
            if printf '%s\n' "$line" | grep -qi 'tls'; then
              score=$((score - 10))
            fi
            if printf '%s\n' "$line" | grep -qi 'ws'; then
              score=$((score - 5))
            fi
            if [ "$port" = "443" ]; then
              score=$((score - 10))
            fi
            if [ "$score" -lt 1 ]; then
              score=1
            fi
            echo "${score}|${line}"
          }
          export MAX_SCORE
          export -f score_server

          # Сканируем все строки, получаем score
          : > scored.txt
          while IFS= read -r line; do
            printf '%s\0' "$line"
          done < filtered.txt | \
            xargs -0 -P 20 -I {} bash -c 'score_server "$1"' _ "{}" \
            >> scored.txt

          # СОРТИРУЕМ по score (меньше = быстрее)
          sort -t'|' -n -k1 scored.txt | cut -d'|' -f2- > sorted.txt

          # ============================================================
          # ВЫБИРАЕМ САМЫЕ БЫСТРЫЕ СЕРВЕРА ИЗ ОТСОРТИРОВАННОГО СПИСКА
          # sorted.txt уже отсортирован - первый = самый быстрый
          # ============================================================
          DATE="$(date +"%d.%m.%Y")"
          TIME="$(date +"%H:%M")"

          # TCP - берём первый подходящий из ОТСОРТИРОВАННОГО списка
          TCP="$(grep -iE '(tcp|reality)' sorted.txt | grep -viE '(grpc|xhttp|ws)' | head -n 1 || echo "")"

          # XHTTP - берём первый подходящий из ОТСОРТИРОВАННОГО списка
          XHTTP="$(grep -iE '(xhttp|http)' sorted.txt | grep -viE '(grpc|tcp|ws)' | head -n 1 || echo "")"

          # gRPC - берём первый подходящий из ОТСОРТИРОВАННОГО списка
          GRPC="$(grep -iE 'grpc' sorted.txt | grep -viE '(tcp|xhttp|ws)' | head -n 1 || echo "")"

          # Fallback: если какой-то не найден - берём любой самый быстрый reality
          if [ -z "$TCP" ]; then
            TCP="$(grep -i 'reality' sorted.txt | head -n 1 || echo "")"
          fi
          if [ -z "$XHTTP" ]; then
            XHTTP="$(grep -i 'reality' sorted.txt | head -n 1 || echo "")"
          fi
          if [ -z "$GRPC" ]; then
            GRPC="$(grep -i 'reality' sorted.txt | head -n 1 || echo "")"
          fi

          # Функция добавления названия через remark
          add_remark() {
            local link="$1"
            local name="$2"
            if [ -z "$link" ]; then
              echo ""
              return
            fi
            if echo "$link" | grep -q '?'; then
              echo "${link}&remark=$(echo "$name" | sed 's/ /%20/g')"
            else
              echo "${link}?remark=$(echo "$name" | sed 's/ /%20/g')"
            fi
          }

          # Формируем файлы с названиями через case
          for PROTO in tcp xhttp grpc; do
            case "$PROTO" in
              tcp)
                TITLE="🚀 MeowMere VPN TCP"
                LINK="$TCP"
                ;;
              xhttp)
                TITLE="🚀 MeowMere VPN XHTTP"
                LINK="$XHTTP"
                ;;
              grpc)
                TITLE="🚀 MeowMere VPN gRPC"
                LINK="$GRPC"
                ;;
            esac

            NAMED_LINK="$(add_remark "$LINK" "$TITLE")"
            eval "${PROTO}_NAMED=\"$NAMED_LINK\""
          done

          # Формируем ОДИН файл только со ссылками (для Happ)
          {
            echo "# profile-title: 🚀 MeowMere VPN"
            echo "# profile-update-interval: 12"
            echo "# subscription-userinfo: upload=0; download=0; total=0; expire=0"
            echo "# update: $DATE $TIME (MSK)"
            echo "# servers: 3"
            echo ""
            if [ -n "$tcp_NAMED" ]; then echo "$tcp_NAMED"; fi
            if [ -n "$xhttp_NAMED" ]; then echo "$xhttp_NAMED"; fi
            if [ -n "$grpc_NAMED" ]; then echo "$grpc_NAMED"; fi
          } > ../public/vpn.txt

          # Копируем
          cp ../public/vpn.txt ../public/android.txt 2>/dev/null || true

          # Сжимаем
          gzip -fk ../public/vpn.txt || true
          gzip -fk ../public/android.txt || true

          sync

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
