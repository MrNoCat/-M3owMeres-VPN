name: VPN Auto Detect Build

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download source
        run: |
          curl -fLsS -o original.txt https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/BLACK_VLESS_RUS.txt

      - name: Check changes (hash detect)
        id: check
        run: |
          NEW_HASH=$(sha256sum original.txt | cut -d' ' -f1)

          if [ -f last_hash.txt ]; then
            OLD_HASH=$(cat last_hash.txt)
          else
            OLD_HASH=""
          fi

          if [ "$NEW_HASH" = "$OLD_HASH" ]; then
            echo "NO_CHANGE=true" >> $GITHUB_OUTPUT
          else
            echo "NO_CHANGE=false" >> $GITHUB_OUTPUT
          fi

          echo $NEW_HASH > last_hash.txt

      - name: Stop if no changes
        if: steps.check.outputs.NO_CHANGE == 'true'
        run: |
          echo "No changes → skip"
          exit 0

      - name: Build VPN files (Android + iOS safe)
        run: |
          export TZ=Europe/Moscow

          # 🔥 базовая очистка
          grep -v '^#' original.txt | grep -v '^$' > clean.txt

          # 🔥 удаление BL
          sed 's/BL//g' clean.txt > no_bl.txt

          # 🔥 удаление дублей по host:port
          awk -F'[@#]' '!seen[$2]++ && length($2)>5' no_bl.txt > unique.txt

          # 🔥 оставить только валидные VPN строки
          grep -E "^vless://|^trojan://|^ss://" unique.txt > valid.txt

          # 🔥 Android SAFE (без заголовков вообще)
          cp valid.txt android.txt

          # 🔥 iOS / full version (с сортировкой)
          > temp.txt

          while read line; do
            score=$((RANDOM % 100))
            echo "$score|$line" >> temp.txt
          done < valid.txt

          sort -n temp.txt | cut -d'|' -f2- > sorted.txt

          # 🔥 финальный файл
          DATE=$(date +"%d.%m.%Y")
          TIME=$(date +"%H:%M")
          COUNT=$(wc -l < sorted.txt)

          {
            echo "# profile-title: 🔥MeowMeres VPN"
            echo "# Date/Time: $DATE $TIME (Moscow)"
            echo "# Servers: $COUNT"
            echo ""
            cat sorted.txt
          } > vpn.txt

          # 🔥 Android version (ВАЖНО: БЕЗ МЕТА ДАННЫХ)
          cp android.txt public/android.txt
          cp vpn.txt public/vpn.txt

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages

    steps:
      - name: Deploy
        uses: actions/deploy-pages@v4
