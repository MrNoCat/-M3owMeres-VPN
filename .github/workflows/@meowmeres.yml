name: Smart VPN Builder PRO (stable-grade)

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download sources (2 feeds)
        run: |
          curl -fLsS -o a.txt https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/main/BLACK_SS%2BAll_RUS.txt
          curl -fLsS -o b.txt https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/main/BLACK_VLESS_RUS_mobile.txt
          cat a.txt b.txt > all.txt

      - name: Build stable list
        run: |
          set -euo pipefail
          export TZ=Europe/Moscow
          mkdir -p public

          # =========================
          # NORMALIZE INPUT
          # =========================
          tr -d '\r' < all.txt > fixed.txt

          # только валидные схемы
          grep -E '^vless://|^trojan://|^ss://' fixed.txt > raw.txt || true

          [ -s raw.txt ] || {
            echo "EMPTY INPUT" > public/vpn.txt
            exit 0
          }

          # =========================
          # REMOVE OBVIOUS BAD NODES
          # =========================
          # мусор, anycast, ru-label servers
          grep -viE 'russia|anycast|moscow|spb|ru' raw.txt > cleaned.txt || true

          # =========================
          # EXTRACT IP LIST
          # =========================
          grep -oE '@([0-9]{1,3}\.){3}[0-9]{1,3}' cleaned.txt \
          | tr -d '@' > ips.txt

          > alive.txt

          # =========================
          # LIVENESS CHECK (like VPN providers)
          # =========================
          while read ip; do
            # быстрый TCP check (443)
            timeout 1 bash -c "</dev/tcp/$ip/443" 2>/dev/null

            if [ $? -eq 0 ]; then
              # оставляем только 1 конфиг на IP (dedup like providers)
              grep "$ip" cleaned.txt | head -n 1 >> alive.txt || true
            fi
          done < ips.txt

          [ -s alive.txt ] || {
            echo "NO LIVE SERVERS" > public/vpn.txt
            exit 0
          }

          # =========================
          # STABILITY SCORING (KEY PART)
          # =========================
          > scored.txt

          while read line; do
            score=100

            # стабильные CDN обычно лучше
            echo "$line" | grep -qiE "cloud|cdn|edge" && score=$((score - 15))

            # подозрительные/битые параметры
            echo "$line" | grep -qE "\\\\|\"|,,|%2C%2C" && score=$((score + 20))

            # reality/xtls обычно стабильнее
            echo "$line" | grep -qi "reality" && score=$((score - 10))

            # штраф за лишние параметры (нестабильные конфиги)
            params=$(echo "$line" | grep -o "?" | wc -l)
            [ "$params" -gt 2 ] && score=$((score + 10))

            echo "$score|$line" >> scored.txt
          done < alive.txt

          # =========================
          # SORT LIKE COMMERCIAL VPN
          # =========================
          sort -n scored.txt | cut -d'|' -f2- > sorted.txt

          # =========================
          # HARD LIMIT (STABILITY)
          # =========================
          head -n 180 sorted.txt > final.txt

          # small shuffle (load balancing)
          shuf final.txt > out.txt

          # =========================
          # OUTPUT FORMAT
          # =========================
          DATE=$(date +"%d.%m.%Y")
          TIME=$(date +"%H:%M")
          COUNT=$(wc -l < out.txt)

          {
            echo "# profile-title: ⚡ MeowMeres VPN"
            echo "# update: $DATE $TIME (MSK)"
            echo "# servers: $COUNT"
            echo "# mode: stable-grade filtering"
            echo ""
            cat out.txt
          } > public/vpn.txt

          cp out.txt public/android.txt

      - name: Upload Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages

    steps:
      - name: Deploy
        uses: actions/deploy-pages@v4
