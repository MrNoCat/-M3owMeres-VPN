name: Smart VPN Stable Builder NO FAIL

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # =========================
      # DOWNLOAD SOURCES
      # =========================
      - name: Download sources
        run: |
          curl -fLsS -o a.txt https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/main/BLACK_SS%2BAll_RUS.txt || true
          curl -fLsS -o b.txt https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/main/BLACK_VLESS_RUS_mobile.txt || true
          cat a.txt b.txt > all.txt

      # =========================
      # BUILD
      # =========================
      - name: Build VPN list
        run: |
          set -euo pipefail
          export TZ=Europe/Moscow
          mkdir -p public

          # =========================
          # INPUT CHECK
          # =========================
          if [ ! -s all.txt ]; then
            echo "NO INPUT DATA" > public/vpn.txt
            exit 0
          fi

          # =========================
          # NORMALIZE (CRLF FIX)
          # =========================
          tr -d '\r' < all.txt > fixed.txt

          # =========================
          # ULTRA STABLE EXTRACT (NO FAIL)
          # =========================
          perl -nle 'while(/(vless|trojan|ss):\/\/[^\s"'"'"<>]+/g){print $&}' fixed.txt \
          | sed 's/[[:space:]]//g' \
          > raw.txt || true

          # =========================
          # SAFETY FALLBACK (NO EMPTY STATE EVER)
          # =========================
          if [ ! -s raw.txt ]; then
            echo "NO VALID LINKS FOUND" > public/vpn.txt
            exit 0
          fi

          # =========================
          # REMOVE TAGS (BL / RU / ANYCAST)
          # =========================
          sed -E 's/\[(BL|RU|ANYCAST)\]//g' raw.txt > cleaned.txt

          # =========================
          # TRIM
          # =========================
          sed 's/[[:space:]]*$//' cleaned.txt > safe.txt

          # =========================
          # VALIDATION (LIGHT)
          # =========================
          grep -E '://.+@.+:[0-9]+' safe.txt > valid.txt || true

          if [ ! -s valid.txt ]; then
            cp safe.txt valid.txt
          fi

          # =========================
          # FILTER RU + ANYCAST (SOFT MODE)
          # =========================
          grep -viE 'russia|moscow|spb|ru|anycast' valid.txt > filtered.txt || true

          if [ ! -s filtered.txt ]; then
            cp valid.txt filtered.txt
          fi

          # =========================
          # LIGHT HEALTH CHECK (SAFE)
          # =========================
          > alive.txt

          while read line; do
            ip=$(echo "$line" | grep -oE '([0-9]{1,3}\.){3}[0-9]{1,3}' | head -n 1)

            if [ -z "$ip" ]; then
              echo "$line" >> alive.txt
              continue
            fi

            timeout 1 bash -c "</dev/tcp/$ip/443" 2>/dev/null && echo "$line" >> alive.txt || true
          done < filtered.txt

          if [ ! -s alive.txt ]; then
            cp filtered.txt alive.txt
          fi

          # =========================
          # LIMIT + SHUFFLE
          # =========================
          head -n 200 alive.txt > final.txt
          shuf final.txt > out.txt

          # =========================
          # OUTPUT
          # =========================
          DATE=$(date +"%d.%m.%Y")
          TIME=$(date +"%H:%M")
          COUNT=$(wc -l < out.txt)

          {
            echo "# profile-title: ⚡MeowMeres VPN"
            echo "# update: $DATE $TIME (MSK)"
            echo "# servers: $COUNT"
            echo ""
            cat out.txt
          } > public/vpn.txt

          cp out.txt public/android.txt

      # =========================
      # DEPLOY
      # =========================
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages

    steps:
      - name: Deploy
        uses: actions/deploy-pages@v4
