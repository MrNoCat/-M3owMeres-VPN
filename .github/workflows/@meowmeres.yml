name: VPN Auto Detect Build

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download source
        run: |
          curl -fLsS -o original.txt https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/main/BLACK_VLESS_RUS.txt

      - name: Check changes (hash detect)
        id: check
        run: |
          NEW_HASH=$(sha256sum original.txt | cut -d' ' -f1)

          if [ -f last_hash.txt ]; then
            OLD_HASH=$(cat last_hash.txt)
          else
            OLD_HASH=""
          fi

          if [ "$NEW_HASH" = "$OLD_HASH" ]; then
            echo "NO_CHANGE=true" >> $GITHUB_OUTPUT
          else
            echo "NO_CHANGE=false" >> $GITHUB_OUTPUT
          fi

          echo $NEW_HASH > last_hash.txt

      - name: Stop if no changes
        if: steps.check.outputs.NO_CHANGE == 'true'
        run: |
          echo "No changes → skip build"
          exit 0

      - name: Build VPN files (clean + no RU)
        run: |
          export TZ=Europe/Moscow
          mkdir -p public

          # 🔥 фикс бинарного файла
          strings original.txt | tr -d '\r' > fixed.txt

          # 🔥 базовая очистка
          grep -a -v '^#' fixed.txt | grep -a -v '^$' > clean.txt

          # 🔥 убираем только #BL (не ломаем ссылки)
          grep -vi '\[BL\]' clean.txt > no_bl.txt

          # 🔥 удаляем дубли по host:port
          awk -F'[@#]' '{
            if (match($0, /@([^#]+)/, m)) {
              hp=m[1]
              if (!seen[hp]++) print $0
            }
          }' no_bl.txt > unique.txt

          # 🔥 оставляем только валидные VPN строки
          grep -E '^vless://|^trojan://|^ss://' unique.txt \
          | tr -d '\r' \
          | sed 's/[[:space:]]//g' \
          | grep -v '^$' > valid.txt

          # 🔥 доп. проверка (чтобы не было мусора)
          grep -E '://.+@.+:[0-9]+' valid.txt > validated.txt

          # 🔥 УДАЛЯЕМ RU СЕРВЕРА (по названию)
          grep -viE '#.*(russia|ru|moscow|spb|novosibirsk)' validated.txt > no_ru.txt

          # если после фильтра пусто
          if [ ! -s no_ru.txt ]; then
            echo "EMPTY LIST" > public/vpn.txt
            echo "EMPTY LIST" > public/android.txt
            exit 0
          fi

          # 🔥 ограничиваем список (ускоряет импорт)
          head -n 300 no_ru.txt > limited.txt

          # 🔥 перемешиваем
          shuf limited.txt > final.txt

          # Android (чистый)
          cp final.txt public/android.txt

          DATE=$(date +"%d.%m.%Y")
          TIME=$(date +"%H:%M")
          COUNT=$(wc -l < final.txt)

          {
            echo "# profile-title: 🔥MeowMeres VPN"
            echo "# Date/Time: $DATE $TIME (Moscow)"
            echo "# Servers: $COUNT"
            echo ""
            cat final.txt
          } > public/vpn.txt

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages

    steps:
      - name: Deploy
        uses: actions/deploy-pages@v4
