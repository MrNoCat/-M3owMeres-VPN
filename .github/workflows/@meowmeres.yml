name: "⚡MeowMeres VPN"

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # =========================
      # DOWNLOAD SOURCES
      # =========================
      - name: Download VPN sources
        run: |
          set +e

          curl -fLsS -o a.txt https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/main/BLACK_SS%2BAll_RUS.txt
          curl -fLsS -o b.txt https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/main/BLACK_VLESS_RUS_mobile.txt

          touch a.txt b.txt
          cat a.txt b.txt > all.txt

      # =========================
      # BUILD LIST
      # =========================
      - name: Build VPN list
        run: |
          set -eo pipefail
          export TZ=Europe/Moscow

          mkdir -p public

          # CHECK INPUT
          if [ ! -s all.txt ]; then
            echo "NO INPUT DATA" > public/vpn.txt
            exit 0
          fi

          # NORMALIZE
          tr -d '\r' < all.txt > fixed.txt

          # EXTRACT LINKS
          grep -aEo '(vless|trojan|ss)://[^[:space:]]+' fixed.txt > raw.txt || true

          if [ ! -s raw.txt ]; then
            echo "NO VALID LINKS FOUND" > public/vpn.txt
            exit 0
          fi

          # REMOVE TAGS
          sed -E 's/\[(RU|BL|ANYCAST)\]//g' raw.txt > cleaned.txt

          # REMOVE DUPLICATES
          awk '!seen[$0]++' cleaned.txt > unique.txt

          # VALIDATION
          grep -aE '://.+@.+:[0-9]+' unique.txt > valid.txt || true

          if [ ! -s valid.txt ]; then
            cp unique.txt valid.txt
          fi

          # FILTER ONLY BAD TAGS (SAFE)
          grep -aviE '#.*(russia|anycast)' valid.txt > filtered.txt || true

          if [ ! -s filtered.txt ]; then
            cp valid.txt filtered.txt
          fi

          # SHUFFLE + LIMIT
          shuf filtered.txt | head -n 250 > out.txt

          # FINAL OUTPUT
          DATE=$(date +"%d.%m.%Y")
          TIME=$(date +"%H:%M")
          COUNT=$(wc -l < out.txt)

          {
            echo "# profile-title: ⚡MeowMeres VPN"
            echo "# update: $DATE $TIME (MSK)"
            echo "# servers: $COUNT"
            echo ""

            cat out.txt
          } > public/vpn.txt

          cp out.txt public/android.txt

      # =========================
      # DEPLOY
      # =========================
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages

    steps:
      - name: Deploy
        uses: actions/deploy-pages@v4
