name: Smart VPN Stable Builder

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download sources
        run: |
          curl -fLsS -o a.txt https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/main/BLACK_SS%2BAll_RUS.txt || true
          curl -fLsS -o b.txt https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/main/BLACK_VLESS_RUS_mobile.txt || true
          cat a.txt b.txt > all.txt

      - name: Build stable VPN list
        run: |
          set -euo pipefail
          export TZ=Europe/Moscow
          mkdir -p public

          # =========================
          # CHECK INPUT SAFETY
          # =========================
          if [ ! -s all.txt ]; then
            echo "NO INPUT DATA" > public/vpn.txt
            exit 0
          fi

          # =========================
          # NORMALIZE FILE
          # =========================
          tr -d '\r' < all.txt > fixed.txt

          # =========================
          # KEEP ONLY VPN LINES (RELAXED)
          # =========================
          grep -E 'vless://|trojan://|ss://' fixed.txt > raw.txt || true

          if [ ! -s raw.txt ]; then
            echo "NO VALID VPN LINES" > public/vpn.txt
            exit 0
          fi

          # =========================
          # REMOVE TAGS ONLY (SAFE)
          # =========================
          sed -E 's/\[(BL|RU|ANYCAST)\]//g' raw.txt > cleaned.txt

          # =========================
          # FIX WHITESPACES ONLY
          # =========================
          sed 's/[[:space:]]*$//' cleaned.txt > safe.txt

          # =========================
          # BASIC VALIDATION (NOT STRICT)
          # =========================
          grep -E '://.+@.+:[0-9]+' safe.txt > valid.txt || true

          if [ ! -s valid.txt ]; then
            echo "NO VALID AFTER FILTER" > public/vpn.txt
            exit 0
          fi

          # =========================
          # REMOVE RU / ANYCAST (SOFT FILTER)
          # =========================
          grep -viE 'russia|moscow|spb|ru|anycast' valid.txt > filtered.txt || true

          # fallback if everything removed
          if [ ! -s filtered.txt ]; then
            cp valid.txt filtered.txt
          fi

          # =========================
          # LIGHT HEALTH CHECK (NO KILLING ALL)
          # =========================
          > alive.txt

          while read line; do
            ip=$(echo "$line" | grep -oE '([0-9]{1,3}\.){3}[0-9]{1,3}' | head -n 1)

            # если IP нет — не удаляем
            if [ -z "$ip" ]; then
              echo "$line" >> alive.txt
              continue
            fi

            timeout 1 bash -c "</dev/tcp/$ip/443" 2>/dev/null

            if [ $? -eq 0 ]; then
              echo "$line" >> alive.txt
            fi
          done < filtered.txt

          # fallback safety
          if [ ! -s alive.txt ]; then
            cp filtered.txt alive.txt
          fi

          # =========================
          # LIMIT FOR MOBILE STABILITY
          # =========================
          head -n 200 alive.txt > final.txt
          shuf final.txt > out.txt

          # =========================
          # OUTPUT
          # =========================
          DATE=$(date +"%d.%m.%Y")
          TIME=$(date +"%H:%M")
          COUNT=$(wc -l < out.txt)

          {
            echo "# profile-title: ⚡MeowMeres VPN"
            echo "# update: $DATE $TIME (MSK)"
            echo "# servers: $COUNT"
            echo ""
            cat out.txt
          } > public/vpn.txt

          cp out.txt public/android.txt

      - name: Upload Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages

    steps:
      - name: Deploy
        uses: actions/deploy-pages@v4
