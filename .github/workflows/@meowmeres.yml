name: VPN Auto Detect Build

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download source
        run: |
          curl -fLsS -o original.txt https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/BLACK_VLESS_RUS.txt

      - name: Check changes (hash detect)
        id: check
        run: |
          NEW_HASH=$(sha256sum original.txt | cut -d' ' -f1)

          if [ -f last_hash.txt ]; then
            OLD_HASH=$(cat last_hash.txt)
          else
            OLD_HASH=""
          fi

          if [ "$NEW_HASH" = "$OLD_HASH" ]; then
            echo "NO_CHANGE=true" >> $GITHUB_OUTPUT
          else
            echo "NO_CHANGE=false" >> $GITHUB_OUTPUT
          fi

          echo $NEW_HASH > last_hash.txt

      - name: Stop if no changes
        if: steps.check.outputs.NO_CHANGE == 'true'
        run: |
          echo "No changes in source → skipping build"
          exit 0

      - name: Build VPN file
        run: |
          export TZ=Europe/Moscow

          # очистка
          grep -v '^#' original.txt | grep -v '^$' > clean.txt
          sed 's/[BL]//g' clean.txt > no_bl.txt

          # УБИРАЕМ ДУБЛИ СРАЗУ
          sort -u no_bl.txt > unique.txt

          mkdir -p public
          > temp.txt

          # псевдо сортировка (пока рандом)
          while read line; do
            score=$((RANDOM % 100))
            echo "$score|$line" >> temp.txt
          done < unique.txt

          # финальная сортировка + защита от дублей
          sort -n temp.txt | cut -d'|' -f2- | sort -u > sorted.txt

          DATE=$(date +"%d.%m.%Y")
          TIME=$(date +"%H:%M")
          COUNT=$(wc -l < sorted.txt)

          {
            echo "# profile-title: 🔥MeowMeres VPN"
            echo "# Date/Time: $DATE $TIME (Moscow)"
            echo "# Количество: $COUNT"
            echo ""
            cat sorted.txt
          } > public/vpn.txt

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages

    steps:
      - name: Deploy
        uses: actions/deploy-pages@v4
