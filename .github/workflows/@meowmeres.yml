name: "⚡MeowMeres VPN"

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # =====================================
      # CHECKOUT
      # =====================================
      - name: Checkout
        uses: actions/checkout@v4

      # =====================================
      # DOWNLOAD SOURCES
      # =====================================
      - name: Download VPN sources
        shell: bash
        run: |
          set -Eeuo pipefail

          mkdir -p work public

          SOURCES=(
            "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/main/BLACK_SS%2BAll_RUS.txt"
            "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/main/BLACK_VLESS_RUS_mobile.txt"
          )

          > work/all.txt

          for url in "${SOURCES[@]}"; do
            echo "Downloading: $url"

            if curl -fL --connect-timeout 10 --max-time 30 -s "$url" >> work/all.txt; then
              echo "" >> work/all.txt
              echo "OK"
            else
              echo "FAILED: $url"
            fi
          done

          if [ ! -s work/all.txt ]; then
            echo "No source data downloaded!"
            exit 1
          fi

      # =====================================
      # BUILD VPN LIST
      # =====================================
      - name: Build VPN list
        shell: bash
        run: |
          set -Eeuo pipefail

          export TZ=Europe/Moscow

          cd work

          # -------------------------
          # NORMALIZE
          # -------------------------
          tr -d '\r' < all.txt > fixed.txt

          # -------------------------
          # EXTRACT LINKS
          # -------------------------
          grep -aEo '(vless|vmess|trojan|ss)://[^[:space:]]+' fixed.txt > raw.txt || true

          if [ ! -s raw.txt ]; then
            echo "NO LINKS FOUND" > ../public/vpn.txt
            exit 0
          fi

          # -------------------------
          # CLEAN TAGS
          # -------------------------
          sed -E \
            -e 's/\[(RU|BL|ANYCAST)\]//g' \
            -e 's/[[:space:]]+$//' \
            raw.txt > clean.txt

          # -------------------------
          # REMOVE DUPLICATES
          # -------------------------
          awk '!seen[$0]++' clean.txt > unique.txt

          # -------------------------
          # FILTER INVALID
          # -------------------------
          grep -aE '^(vless|vmess|trojan|ss)://' unique.txt > valid.txt || true

          if [ ! -s valid.txt ]; then
            cp unique.txt valid.txt
          fi

          # -------------------------
          # REMOVE BAD TAGS
          # -------------------------
          grep -aviE '#.*(blocked|expired|test)' valid.txt > filtered.txt || true

          if [ ! -s filtered.txt ]; then
            cp valid.txt filtered.txt
          fi

          # -------------------------
          # SCORE SERVERS
          # -------------------------
          > scored.txt

          while IFS= read -r line; do

            host=$(echo "$line" | \
              grep -oP '@\K([^:/?#]+)' | \
              head -n 1 || true)

            if [ -z "${host:-}" ]; then
              echo "9999|$line" >> scored.txt
              continue
            fi

            # Resolve domain if needed
            if [[ "$host" =~ ^([0-9]{1,3}\.){3}[0-9]{1,3}$ ]]; then
              target="$host"
            else
              target=$(getent ahostsv4 "$host" | awk '{print $1}' | head -n 1 || true)
            fi

            if [ -z "${target:-}" ]; then
              echo "9999|$line" >> scored.txt
              continue
            fi

            # Ping test
            if timeout 2 ping -c 1 -W 1 "$target" >/dev/null 2>&1; then
              latency=$(ping -c 1 -W 1 "$target" 2>/dev/null | \
                grep 'time=' | \
                sed -E 's/.*time=([0-9.]+).*/\1/' | \
                cut -d'.' -f1 || true)

              latency=${latency:-999}
            else
              latency=9999
            fi

            echo "${latency}|${line}" >> scored.txt

          done < filtered.txt

          # -------------------------
          # SORT BY LATENCY
          # -------------------------
          sort -t'|' -n -k1 scored.txt | cut -d'|' -f2- > sorted.txt

          # -------------------------
          # LIMIT SERVERS
          # -------------------------
          head -n 200 sorted.txt > final.txt

          COUNT=$(wc -l < final.txt)

          DATE=$(date +"%d.%m.%Y")
          TIME=$(date +"%H:%M")

          # -------------------------
          # CREATE OUTPUT
          # -------------------------
          {
            echo "# profile-title: ⚡MeowMeres VPN"
            echo "# profile-update-interval: 30"
            echo "# subscription-userinfo: upload=0; download=0; total=0; expire=0"
            echo "# update: $DATE $TIME (MSK)"
            echo "# servers: $COUNT"
            echo ""

            cat final.txt

          } > ../public/vpn.txt

          cp final.txt ../public/android.txt

      # =====================================
      # UPLOAD ARTIFACT
      # =====================================
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    needs: build

    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
