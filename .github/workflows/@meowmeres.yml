name: M3owMeres VPN Build

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download VPN source
        run: |
          curl -fLsS -o original.txt https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/BLACK_VLESS_RUS.txt

      - name: Build VPN file (stable)
        run: |
          export TZ=Europe/Moscow

          # чистка
          grep -v '^#' original.txt | grep -v '^$' > clean.txt
          sed 's/BL//g' clean.txt > no_bl.txt

          mkdir -p public

          > temp.txt

          # стабильная "скорость"
          while read line; do
            host=$(echo "$line" | grep -oE '@[^: ]+' | tr -d '@')

            if [ -n "$host" ]; then
              score=$((RANDOM % 100))
            else
              score=999
            fi

            echo "$score|$line" >> temp.txt
          done < no_bl.txt

          sort -n temp.txt | cut -d'|' -f2- > sorted.txt

          # header
          DATE=$(date +"%d.%m.%Y")
          TIME=$(date +"%H:%M")
          COUNT=$(wc -l < sorted.txt)

          {
            echo "# profile-title: 🔥MeowMeres VPN"
            echo "# Date/Time: $DATE $TIME (Moscow)"
            echo "# Количество: $COUNT"
            echo ""
            cat sorted.txt
          } > public/vpn.txt

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages

    steps:
      - name: Deploy
        uses: actions/deploy-pages@v4
